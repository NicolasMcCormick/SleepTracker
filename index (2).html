<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SleepTracker Premium</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;padding:20px}.hero{text-align:center;margin-bottom:20px}.hero h1{color:#38bdf8}.section{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}.section h2{color:#38bdf8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:10px;border:none;border-radius:10px;background:#334155;color:white}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.check{display:flex;align-items:center;gap:12px;background:#243447;padding:12px;border-radius:12px}.check input{width:20px;height:20px}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#38bdf8;color:#001;font-weight:bold;cursor:pointer}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.chart{background:#243447;padding:10px;border-radius:12px}canvas{background:white;border-radius:8px}</style></head><body><div class="hero"><h1>😴 SleepTracker Premium</h1><p>Habitudes Jour J ➜ Sommeil Jour J+1</p></div><div class="section"><h2>🌙 Nuit observée</h2><div class="grid"><div class="field"><label>Qualité sommeil</label><input id="qualite" type="number" min="1" max="10"></div><div class="field"><label>Heures sommeil</label><input id="heures" type="number" step="0.1"></div><div class="field"><label>Énergie réveil</label><input id="energie" type="number"></div><div class="field"><label>Endormissement</label><select id="endormissement"><option>1</option><option>2</option><option>3</option></select></div><div class="field"><label>Réveils nocturnes</label><input id="reveils" type="number"></div><div class="field"><label>Stress</label><input id="stress" type="number"></div><div class="field"><label>Activation</label><input id="activation" type="number"></div></div><br><div class="checks"><label class="check"><input id="cortisol" type="checkbox"><span>Réveil type cortisol</span></label><label class="check"><input id="malTete" type="checkbox"><span>Mal de tête au réveil</span></label></div></div><div class="section"><h2>🍽️ Nutrition</h2><div class="checks"><label class="check"><input type="checkbox">Sans lactose</label><label class="check"><input type="checkbox">Sans gluten</label><label class="check"><input type="checkbox">Pas de café</label><label class="check"><input type="checkbox">Pas d'alcool</label><label class="check"><input type="checkbox">Charbon actif</label></div></div><div class="section"><h2>💊 Compléments</h2><div class="checks"><label class="check"><input type="checkbox">Magnésium</label><label class="check"><input type="checkbox">Safran</label><label class="check"><input type="checkbox">Vitamine D</label><label class="check"><input type="checkbox">Quercétine</label><label class="check"><input type="checkbox">Quviviq</label></div></div><div class="section"><h2>🧘 Relaxation</h2><div class="checks"><label class="check"><input type="checkbox">Respiration diaphragmatique</label><label class="check"><input type="checkbox">Méditation 20 min</label><label class="check"><input type="checkbox">Étirements</label><label class="check"><input type="checkbox">Lecture le soir</label><label class="check"><input type="checkbox">Arrêt écran 1h avant coucher</label></div></div><div class="section"><h2>🏃 Activité</h2><div class="checks"><label class="check"><input type="checkbox">Sport en journée</label><label class="check"><input type="checkbox">Musculation</label><label class="check"><input type="checkbox">Foot entraînement soir</label></div><br><button class="btn" onclick="saveData()">Enregistrer</button></div><div class="section"><h2>📈 Graphiques</h2><div class="charts"><div class="chart"><canvas id="c1"></canvas></div><div class="chart"><canvas id="c2"></canvas></div><div class="chart"><canvas id="c3"></canvas></div><div class="chart"><canvas id="c4"></canvas></div><div class="chart"><canvas id="c5"></canvas></div></div></div><script>let d=JSON.parse(localStorage.getItem('sleeptracker')||'[]');function saveData(){d.push({date:new Date().toLocaleDateString(),qualite:+qualite.value||0,heures:+heures.value||0,energie:+energie.value||0,stress:+stress.value||0,activation:+activation.value||0});localStorage.setItem('sleeptracker',JSON.stringify(d));location.reload()}function graph(id,l,k){new Chart(document.getElementById(id),{type:'line',data:{labels:d.map(x=>x.date),datasets:[{label:l,data:d.map(x=>x[k]),borderColor:'#38bdf8',tension:.3}]}})}if(d.length){graph('c1','Qualité','qualite');graph('c2','Énergie','energie');graph('c3','Heures','heures');graph('c4','Stress','stress');graph('c5','Activation','activation')}</script></body></html>
