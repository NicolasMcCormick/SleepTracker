<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sleep Tracker V4</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:20px}.card{border:1px solid #ddd;border-radius:10px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:6px 0}button{background:#2563eb;color:white;border:none;padding:10px;border-radius:6px}</style></head><body><h1>🌙 Sleep Tracker V4</h1><div class='card'><b>Date :</b> <span id='d'></span><p>Les habitudes du jour seront analysées par rapport au sommeil observé le lendemain.</p></div><div class='card'><h2>🌙 Nuit observée (nuit passée)</h2><label>Qualité sommeil <input id='sleep' type='number' min='1' max='10'></label><label>Heures sommeil <input id='hours' type='number' step='0.5'></label><label>Énergie réveil <input id='energy' type='number' min='1' max='10'></label><label><input id='nightwake' type='checkbox'> Réveil nocturne</label><label><input id='cortisolwake' type='checkbox'> Réveil matinal type cortisol</label></div><div class='grid'><div class='card'><h3>Nutrition</h3><label><input id='nolactose' type='checkbox'> Sans lactose</label><label><input id='nogluten' type='checkbox'> Sans gluten</label><label><input id='nocafe' type='checkbox'> Pas de café</label><label><input id='charbon' type='checkbox'> Charbon actif</label><label><input id='bloat' type='checkbox'> Ballonnements</label></div><div class='card'><h3>Compléments</h3><label><input id='magnesium' type='checkbox'> Magnésium</label><label><input id='safran' type='checkbox'> Safran</label><label><input id='vitd' type='checkbox'> Vitamine D</label></div><div class='card'><h3>Relaxation</h3><label><input id='resp' type='checkbox'> Respiration diaphragmatique</label><label><input id='med' type='checkbox'> Méditation</label><label><input id='stretch' type='checkbox'> Étirements</label><label><input id='screen' type='checkbox'> Arrêt écrans 1h avant coucher</label></div><div class='card'><h3>Activité</h3><label><input id='sport' type='checkbox'> Sport</label><label><input id='football' type='checkbox'> Foot entraînement soir</label></div></div><div class='card'><h2>☀️ Journée</h2><label>Stress (1-10) <input id='stress' type='number'></label><label>Activation au coucher (1-10) <input id='activation' type='number'></label><button onclick='saveEntry()'>Enregistrer</button></div><div class='card'><h2>📊 Tableau de bord</h2><div id='stats'></div><button onclick='analyze()'>Actualiser les analyses</button><canvas id='sleepChart'></canvas><canvas id='energyChart'></canvas><div id='analysis'></div></div><script>document.getElementById('d').innerText=new Date().toLocaleDateString('fr-FR');function db(){return JSON.parse(localStorage.getItem('sleepTrackerV4')||'[]')}function saveEntry(){let o={date:new Date().toLocaleDateString('fr-FR'),sleep:+sleep.value,hours:+hours.value,energy:+energy.value,nightwake:nightwake.checked,cortisolwake:cortisolwake.checked,nolactose:nolactose.checked,nogluten:nogluten.checked,nocafe:nocafe.checked,charbon:charbon.checked,bloat:bloat.checked,magnesium:magnesium.checked,safran:safran.checked,vitd:vitd.checked,resp:resp.checked,med:med.checked,stretch:stretch.checked,screen:screen.checked,sport:sport.checked,football:football.checked,stress:+stress.value,activation:+activation.value};let d=db();d.push(o);localStorage.setItem('sleepTrackerV4',JSON.stringify(d));alert('Enregistré');}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}let c1,c2;function analyze(){let data=db();if(!data.length)return;let avgSleep=avg(data.map(x=>x.sleep)).toFixed(1);let avgHours=avg(data.map(x=>x.hours)).toFixed(1);let nw=(100*data.filter(x=>x.nightwake).length/data.length).toFixed(0);let cw=(100*data.filter(x=>x.cortisolwake).length/data.length).toFixed(0);stats.innerHTML='<b>Qualité moyenne :</b> '+avgSleep+'/10 | <b>Sommeil moyen :</b> '+avgHours+'h | <b>Réveils nocturnes :</b> '+nw+'% | <b>Réveils cortisol :</b> '+cw+'%';let factors=['nolactose','nogluten','nocafe','charbon','bloat','magnesium','safran','vitd','resp','med','stretch','screen','sport','football'];let res=[];for(let f of factors){let y=data.filter(r=>r[f]).map(r=>r.sleep);let n=data.filter(r=>!r[f]).map(r=>r.sleep);res.push([f,avg(y)-avg(n)]);}res.sort((a,b)=>b[1]-a[1]);analysis.innerHTML='<h3>🔝 Facteurs favorables</h3><ol>'+res.slice(0,3).map(x=>'<li>'+x[0]+' ('+x[1].toFixed(2)+')</li>').join('')+'</ol><h3>🔻 Facteurs défavorables</h3><ol>'+res.slice(-3).reverse().map(x=>'<li>'+x[0]+' ('+x[1].toFixed(2)+')</li>').join('')+'</ol>';let labels=data.map(x=>x.date);if(c1)c1.destroy();if(c2)c2.destroy();c1=new Chart(document.getElementById('sleepChart'),{type:'line',data:{labels:labels,datasets:[{label:'Qualité du sommeil',data:data.map(x=>x.sleep)}]}});c2=new Chart(document.getElementById('energyChart'),{type:'line',data:{labels:labels,datasets:[{label:'Énergie au réveil',data:data.map(x=>x.energy)}]}});}analyze();</script></body></html>
